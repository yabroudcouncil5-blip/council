<div class="dashboard-field-label">{{ field.label_tag }}</div>
<div class="dashboard-field-value">
    {% if field.is_readonly %}{% include "unfold/helpers/field_readonly_value.html" %}{% else %}{{ field.field }}{% endif %}
    {% if field.field.help_text %}<div class="dashboard-help">{{ field.field.help_text|safe }}</div>{% endif %}
    {% if field.errors %}<div class="dashboard-field-errors" role="alert">{{ field.errors }}</div>{% endif %}
</div>
