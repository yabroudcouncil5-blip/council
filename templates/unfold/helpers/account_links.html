<div class="dashboard-menu-anchor" x-data="{ openUserLinks: false }" x-on:keydown.escape.prevent.stop="openUserLinks = false; $refs.accountButton.focus()">
    <button id="dashboard-account-button" class="dashboard-control" type="button" x-ref="accountButton" x-on:click="openUserLinks = !openUserLinks" aria-label="حساب المستخدم" aria-controls="dashboard-account-menu" x-bind:aria-expanded="openUserLinks">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v2Z"/></svg>
        <span class="dashboard-account-label">حسابي</span>
    </button>
    <nav id="dashboard-account-menu" class="dashboard-menu" x-cloak x-show="openUserLinks" x-transition.opacity x-on:click.outside="openUserLinks = false" aria-labelledby="dashboard-account-button">
        <div class="dashboard-menu-heading"><small>مسجل الدخول باسم</small><bdi>{% firstof user.get_full_name user.get_username %}</bdi></div>
        {% if site_url %}<a href="{{ site_url }}">عرض الموقع</a>{% endif %}
        {% if account_links %}
            {% for link in account_links %}<a href="{{ link.link }}">{{ link.title }}</a>{% endfor %}
        {% elif user.has_usable_password %}
            <a href="{% url 'admin:password_change' %}">تغيير كلمة المرور</a>
        {% endif %}
        <form id="logout-form" method="post" action="{% url 'admin:logout' %}">
            {% csrf_token %}
            <button type="submit" class="dashboard-logout">تسجيل الخروج</button>
        </form>
    </nav>
</div>
