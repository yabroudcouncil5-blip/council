{% if not theme %}
<div class="dashboard-menu-anchor" x-data="{ openTheme: false }" x-on:keydown.escape.prevent.stop="openTheme = false; $refs.themeButton.focus()">
    <button id="dashboard-theme-button" class="dashboard-control" type="button" x-ref="themeButton" x-on:click="openTheme = !openTheme" aria-label="اختيار مظهر اللوحة" aria-controls="dashboard-theme-menu" x-bind:aria-expanded="openTheme">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <g x-show="adminTheme === 'light'"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></g>
            <path x-show="adminTheme === 'dark'" d="M20.5 13a9 9 0 0 1-9.5-9.5A9 9 0 1 0 20.5 13Z"/>
            <g x-show="adminTheme === 'auto'"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></g>
        </svg>
    </button>
    <div id="dashboard-theme-menu" class="dashboard-menu dashboard-theme-menu" x-cloak x-show="openTheme" x-transition.opacity x-on:click.outside="openTheme = false" aria-labelledby="dashboard-theme-button">
        <button type="button" data-theme-choice="light" x-bind:aria-pressed="adminTheme === 'light'" x-on:click="adminTheme = 'light'; openTheme = false; $refs.themeButton.focus()">فاتح</button>
        <button type="button" data-theme-choice="dark" x-bind:aria-pressed="adminTheme === 'dark'" x-on:click="adminTheme = 'dark'; openTheme = false; $refs.themeButton.focus()">داكن</button>
        <button type="button" data-theme-choice="auto" x-bind:aria-pressed="adminTheme === 'auto'" x-on:click="adminTheme = 'auto'; openTheme = false; $refs.themeButton.focus()">حسب إعدادات الجهاز</button>
    </div>
</div>
{% endif %}
