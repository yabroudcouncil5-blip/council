<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول الموظفين | بلدية يبرود</title><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#07594f,#0b8b7c);font-family:'Noto Kufi Arabic',Tahoma;color:#17324d;display:grid;place-items:center;padding:20px}.login{width:min(440px,100%);background:#fff;border-radius:20px;padding:34px;box-shadow:0 20px 55px #003b3540}.brand{display:flex;align-items:center;gap:12px;color:#07594f;font-size:22px;font-weight:700;margin-bottom:25px}.mark{display:grid;place-items:center;width:42px;height:42px;background:#e7c65b;border-radius:12px}.login h1{font-size:23px;margin:0 0 8px}.login>p{color:#71838c;font-size:12px;margin:0 0 25px}.field{margin:16px 0}.field label{display:block;font-size:12px;font-weight:600;margin-bottom:7px;color:#49616d}.field input{width:100%;padding:12px;border:1px solid #cbdedb;border-radius:9px;font:inherit;direction:rtl}.field input:focus{outline:3px solid #087f7325;border-color:#087f73}.errorlist{color:#a64040;font-size:12px;padding:0;list-style:none}button{width:100%;padding:13px;border:0;border-radius:9px;background:#087f73;color:#fff;font:600 14px inherit;cursor:pointer;margin-top:8px}button:hover{background:#07594f}.back{display:block;text-align:center;color:#087f73;text-decoration:none;font-size:12px;margin-top:18px}</style></head><body><main class="login"><div class="brand"><span class="mark">ي</span><span>بلدية يبرود</span></div><h1>دخول الموظفين</h1><p>سجّل الدخول للوصول إلى لوحة الإدارة ومتابعة الشكاوى.</p><form method="post">{% csrf_token %}{% if form.non_field_errors %}{{ form.non_field_errors }}{% endif %}<div class="field"><label for="id_username">اسم المستخدم</label>{{ form.username }}{{ form.username.errors }}</div><div class="field"><label for="id_password">كلمة المرور</label>{{ form.password }}{{ form.password.errors }}</div><button type="submit">تسجيل الدخول</button></form><a class="back" href="/">العودة إلى الموقع العام</a></main></body></html>
