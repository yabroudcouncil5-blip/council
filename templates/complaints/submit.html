<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقديم شكوى</title><style>body{font-family:Arial;max-width:700px;margin:2rem auto;padding:1rem}label{display:block;margin:1rem 0}input,textarea{width:100%;padding:.7rem;box-sizing:border-box}button{padding:.8rem 1.5rem;background:#087f73;color:#fff;border:0;border-radius:6px}</style><h1>تقديم شكوى</h1><form method="post" action="/api/complaints/" enctype="multipart/form-data">{% csrf_token %}<label>العنوان<input name="title" required></label><label>الوصف<textarea name="description" required></textarea></label><label>الاسم (اختياري)<input name="name"></label><label>الهاتف (اختياري)<input name="phone"></label><label>البريد الإلكتروني (اختياري)<input name="email" type="email"></label><label>الموقع<input name="location"></label><label>صورة (اختيارية، 5MB كحد أقصى)<input name="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><button>إرسال الشكوى</button></form></html>
