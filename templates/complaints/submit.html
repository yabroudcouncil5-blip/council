<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقديم شكوى | بلدية يبرود</title><style>body{margin:0;background:#f2f7f6;color:#123047;font-family:Arial,sans-serif;line-height:1.8}.wrap{max-width:760px;margin:30px auto;padding:0 20px}.back{color:#087f73;font-weight:bold}.panel{background:#fff;border:1px solid #dce8e6;border-radius:18px;padding:28px;box-shadow:0 10px 30px #12304712}h1{margin-bottom:4px}p{color:#617487}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;margin:15px 0;font-weight:700}input,textarea,select{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid #cbdad8;border-radius:8px;box-sizing:border-box;font:inherit}textarea{min-height:130px}button{padding:12px 22px;background:#087f73;color:#fff;border:0;border-radius:8px;font:inherit;font-weight:bold;cursor:pointer}.actions{display:flex;gap:10px;align-items:center;margin-top:18px}.cancel{padding:11px 20px;border:1px solid #cbdad8;border-radius:8px;color:#536978;background:#fff;font-weight:bold}.cancel:hover{background:#f2f7f6}#result{margin-top:18px;padding:14px;border-radius:9px;background:#e9f7f3;white-space:pre-line}@media(max-width:600px){.row{grid-template-columns:1fr}.actions{flex-direction:column;align-items:stretch;text-align:center}}</style><main class="wrap"><a class="back" href="/">← العودة للموقع</a><div class="panel"><div style="color:#087f73;font-weight:bold">بوابة الخدمات البلدية</div><h1>تقديم شكوى أو ملاحظة</h1><p>أرسل التفاصيل وسنحيلها إلى القسم المختص. لا تحتاج إلى إنشاء حساب.</p><form method="post" action="/api/complaints/" enctype="multipart/form-data">{% csrf_token %}<label>عنوان الشكوى *<input name="title" required></label><label>التفاصيل *<textarea name="description" required></textarea></label><div class="row"><label>التصنيف<select name="category"><option value="">اختر التصنيف</option>{% for category in categories %}<option value="{{ category.pk }}">{{ category.name }}</option>{% endfor %}</select></label><label>الموقع<input name="location" placeholder="الحي أو الشارع"></label></div><div class="row"><label>الاسم (اختياري)<input name="name"></label><label>الهاتف (اختياري)<input name="phone"></label></div><label>البريد الإلكتروني (اختياري)<input name="email" type="email"></label><label>صورة داعمة (اختيارية)<input name="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><div class="actions"><button type="submit">إرسال الشكوى</button><a class="cancel" href="/">إلغاء والعودة للرئيسية</a></div></form><div id="result" hidden></div></div></main><script>document.querySelector('form').addEventListener('submit',async function(e){e.preventDefault();const r=document.getElementById('result');const x=await fetch(this.action,{method:'POST',body:new FormData(this)});const d=await x.json();r.hidden=false;r.textContent=x.ok?'تم استلام الشكوى\nالرقم المرجعي: '+d.reference+'\nرمز التتبع: '+d.tracking_code:'تعذر الإرسال: '+(d.error||'حدث خطأ');if(x.ok)this.reset()})</script></html>
