server {
    listen 80;
    server_name council.example.org;
    client_max_body_size 10M;

    location /static/ { alias /srv/yabroud/staticfiles/; expires 30d; add_header Cache-Control "public, immutable"; }
    location /media/council/logos/ {
        alias /srv/yabroud/media/council/logos/;
        add_header X-Content-Type-Options nosniff always;
    }
    location /media/ { deny all; return 404; }
    location / { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}
